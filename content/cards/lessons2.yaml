    usage: 目标：做出自然的动效。知识点：animateTo 参数、页面转场 350ms、弹性曲线 springMotion、打断与速度继承。
    example: "animateTo({ duration: 300, curve: Curve.Standard }, () => {\n  this.scale = 1.2;\n});"
