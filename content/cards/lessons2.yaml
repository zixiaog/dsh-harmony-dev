- id: lesson.16
  domain: tutorial
  title: "第 16 讲：无障碍实现"
  summary: accessibilityText、焦点顺序、大字体与对比度。
  level: 进阶
  order: 16
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  sections:
    usage: 目标：让读屏用户能用。知识点：可读文本、焦点顺序、最小触控区、fp 字号、对比度 ≥3:1。
    example: "Image($r('app.media.back'))\n  .width(24).height(24)\n  .accessibilityText('返回上一页')\n  .onClick(() => this.pathStack.pop())"
