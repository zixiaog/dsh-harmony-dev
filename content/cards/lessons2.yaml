  sources: []
  updated: 2026-11-04

- id: lesson.19
  domain: tutorial
  title: "第 19 讲：状态管理进阶"
  summary: "@Monitor/@Computed、AppStorageV2、PersistenceV2 与性能。"
  level: 进阶
