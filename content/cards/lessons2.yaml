    usage: 目标：状态清晰、重绘可控。知识点：派生状态 @Computed、副作用 @Monitor、应用级 AppStorageV2、持久化 PersistenceV2、避免大对象整体刷新。
    example: "@Computed\nget total() { return this.items.reduce((s, i) => s + i.price, 0); }"
