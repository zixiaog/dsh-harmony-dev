- id: lesson.17
  domain: tutorial
  title: "第 17 讲：网络进阶"
  summary: 超时与重试、错误分类、缓存与并发控制。
  level: 进阶
  order: 17
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  sections:
    usage: 目标：让网络层可维护。知识点：请求封装、错误分类（网络/HTTP/业务）、指数退避重试、弱网提示、并发限制。
    example: "async function withRetry<T>(fn: () => Promise<T>, n = 2): Promise<T> {\n  try { return await fn(); }\n  catch (e) { if (n <= 0) throw e; return withRetry(fn, n - 1); }\n}"
    pitfalls: [所有错误都提示「网络异常」, 无重试上限]
  checkpoints:
    - 能区分网络错误与业务错误
    - 能实现带退避的重试
  exercise: 封装一个带重试与超时的请求工具
  tokens: []
  version_note: ""
  sources: []
  updated: 2026-11-04

- id: lesson.18
  domain: tutorial
  title: "第 18 讲：数据进阶"
  summary: RDB 事务、版本迁移、加密与大数据量分页。
  level: 进阶
  order: 18
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  sections:
    usage: 目标：数据层可演进。知识点：事务批量写、schema 版本迁移、敏感字段加密（HUKS）、分页查询。
    example: "store.beginTransaction();\ntry { for (const item of list) await store.insert('t', item); store.commit(); }\ncatch (e) { store.rollBack(); throw e; }"
    pitfalls: [升级不迁移导致旧数据丢失, 全表查询再内存分页]
  checkpoints:
    - 能写事务并处理回滚
    - 能设计一次 schema 迁移
  exercise: 给待办表加一个字段并迁移旧数据
