# 进阶课程（第 11~28 讲）。与 lessons.yaml 同 schema。
- id: lesson.11
  domain: tutorial
  title: "第 11 讲：自定义组件与复用"
  summary: 抽取可复用组件，@Builder/@Reusable 与参数设计。
  level: 进阶
  order: 11
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  sections:
    usage: 目标：把重复 UI 抽成组件。知识点：@ComponentV2 自定义组件、@Builder 片段、@Reusable 复用池、@Param 设计。
    example: "@ComponentV2\nstruct CardItem {\n  @Param title: string = '';\n  @Param onClick: () => void = () => {};\n  build() { Row() { Text(this.title) }.onClick(this.onClick) }\n}"
    pitfalls: [组件参数过多难维护, "@Reusable 未重置状态"]
  checkpoints:
    - 能判断何时抽组件、何时用 @Builder
    - 能解释 @Reusable 的复用条件
  exercise: 把设置页的列表项抽成可复用组件
  tokens: []
  version_note: ""
  sources: []
  updated: 2026-11-04

- id: lesson.12
  domain: tutorial
  title: "第 12 讲：动效与转场"
  summary: animateTo、transition、弹簧曲线与可打断动效。
  level: 进阶
