- id: lesson.13
  domain: tutorial
  title: "第 13 讲：一多适配"
  summary: 断点、分栏、媒体查询与多设备布局策略。
  level: 进阶
  order: 13
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  sections:
    usage: 目标：一套代码适配手机/折叠/平板/PC。知识点：600/840vp 断点、4/8/12 列栅格、分栏 vp≥600、宽高比挪移。
    example: "const listener = mediaquery.matchMediaSync('(840vp<=width)');\nlistener.on('change', (res) => { this.isWide = res.matches; });"
