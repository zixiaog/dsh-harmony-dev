- id: design.layout.breakpoint
  domain: design
  title: 窗口断点
  summary: 按窗口宽度分 4/8/12 列三档，门槛 600vp 与 840vp；同时参考窗口宽高比。
  designClass: layout
  codeClass: layout
  applies_to: [phone, tablet, 2in1]
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: 0–600 用 4 列；600–840 用 8 列；≥840 用 12 列；分屏按分屏后窗口算。
    example: "mediaquery.matchMediaSync('(600vp<=width<840vp)')"
    pitfalls: [用屏幕宽度而非窗口宽度, 忽略宽高比]
  tokens: [layout.breakpoints]
  version_note: "断点完整分档表官方页为图，数值表待补"
  sources:
