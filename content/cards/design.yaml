  tokens: [layout.grids, layout.maxContentWidthVp]
  version_note: ""
  sources:
    - { title: 布局基础, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/design-layout-basics-0000001795579413.md", fetched: 2026-11-04 }
