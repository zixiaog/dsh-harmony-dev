- id: design.font.scale
  domain: design
  title: 字号阶梯
  summary: 字号只能取 Display/Title/Subtitle/Body/Caption 五类 15 级，不同设备各有取值。
  designClass: typography
  codeClass: font
  applies_to: [phone, tablet, 2in1, watch]
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: 手机 Body_M=14、Title_L=30；PC 同 token 更小（Title_L=28）；手表 Body_M=14。
    example: "Text('标题').fontSize(30).fontWeight(FontWeight.Bold) // Title_L（按设备取 token 值）"
    pitfalls: [fontSize(17) 这类非阶梯值, 标题用 26 这种自定义档]
  tokens: [font.Display_L, font.Title_L, font.Subtitle_M, font.Body_M, font.Caption_M]
  version_note: ""
  sources:
    - { title: 文本排版, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/typography-0000002622688363.md", fetched: 2026-11-04 }
  updated: 2026-11-04

