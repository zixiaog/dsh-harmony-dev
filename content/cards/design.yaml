    usage: 图标按钮、图片按钮、自绘控件都要给可读文本；字号用 fp 以跟随大字体。
    example: "Image($r('app.media.icon')).accessibilityText('设置')"
    pitfalls: [图标按钮无文本, 用 vp 写字号导致不跟随大字体]
