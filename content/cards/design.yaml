- id: design.space.screen-margin
  domain: design
  title: 屏幕边缘间距
  summary: 左右 margin 按设备：手机 16 / 折叠 24 / 平板 32 / 智慧屏 48 / 穿戴 26 / PC 40 / 座舱 48vp。
  designClass: layout
  codeClass: spacing
  applies_to: [phone, tablet, 2in1, watch, vision, cockpit]
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: 顶部/底部 margin 另有档位（手机 36/28vp）；内容不得贴边。
    example: ".padding({ left: 16, right: 16 }) // 手机左右 margin"
    pitfalls: [所有设备都写 16, 内容贴边]
  tokens: [space.screenMargin]
  version_note: ""
  sources:
    - { title: 间隔参数, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/interval-parameter-0000002562577161.md", fetched: 2026-11-04 }
  updated: 2026-11-04

- id: design.space.element-gap
  domain: design
  title: 元素间距档位
  summary: 卡片间 12vp；控件间较大 16vp、普通 8vp；左右同理。
  designClass: layout
  codeClass: spacing
  applies_to: [phone, tablet, 2in1]
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: 有明显边界用 16vp，无明显边界用 8vp；卡片之间 12vp。
    example: "List({ space: 8 }) // 列表项普通间隔"
    pitfalls: [13/18 这类非档位值, 同组间距不一致]
  tokens: [space.elements.cardGap, space.elements.gapLarge, space.elements.gapNormal]
  version_note: ""
  sources:
