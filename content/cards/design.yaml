- id: design.font.family
  domain: design
  title: 系统字体与大字体
  summary: 默认 HarmonyOS Sans；支持系统大字体（fp 随用户缩放）。
  designClass: typography
  codeClass: font
  applies_to: [phone, tablet, 2in1, watch]
  since: "—"
