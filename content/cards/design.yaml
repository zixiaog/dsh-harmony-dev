- id: design.color.semantic
  domain: design
  title: 语义色
  summary: 强调色只用 brand / warning / alert / confirm 四个语义色，禁止自造品牌色。
  designClass: color
  codeClass: color
  applies_to: [phone, tablet, 2in1]
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: 品牌色 Light #ff0a59f7 / Dark #ff317af7；warning 一级警示、alert 二级警示、confirm 成功。
    example: "- 正确：.backgroundColor($r('app.color.brand'))\n- 错误：.backgroundColor('#0A59F7')"
    pitfalls: [自造品牌色, 用纯黑纯白当文本色]
  tokens: [color.brand, color.warning, color.alert, color.confirm]
  version_note: ""
  sources:
    - { title: 色彩, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/color-0000001776857164.md", fetched: 2026-11-04 }
  updated: 2026-11-04

- id: design.color.text-levels
  domain: design
  title: 文本与图标分级
  summary: 文本/图标分四级（e5/99/66/33 透明度）+ 高亮 + 反色，不得自造层级。
  designClass: color
  codeClass: color
  applies_to: [phone, tablet, 2in1]
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: 一级 e5 / 二级 99 / 三级 66 / 四级 33；高亮用 font_emphasize；主色底上用 font_on_primary。
    example: "Text('说明').fontColor($r('app.color.font_tertiary'))"
    pitfalls: [四级文本当正文用（对比度不足）, 深色下仍用黑色文本]
  tokens: [color.font_primary, color.font_secondary, color.font_tertiary, color.font_fourth, color.font_emphasize, color.font_on_primary]
  version_note: ""
  sources:
    - { title: 色彩, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/color-0000001776857164.md", fetched: 2026-11-04 }
  updated: 2026-11-04

- id: design.color.contrast
  domain: design
  title: 阅读对比度
  summary: 文本与图标对背景的对比度最小 3:1，正文建议 ≥4.5:1。
  designClass: color
  codeClass: color
  applies_to: [phone, tablet, 2in1]
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: 公式 (Lmax+0.05)/(Lmin+0.05)；官方最小 3:1，长正文建议 4.5:1。
    example: "- 正确：#e5000000 on #ffffff（约 17.4:1）\n- 错误：#66000000 on #ffffff（约 2.85:1）"
    pitfalls: [浅灰字当正文, 彩色底上叠彩色字]
  tokens: [color.font_primary, color.font_secondary, color.font_tertiary, color.font_fourth]
  version_note: ""
  sources:
    - { title: 色彩, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/color-0000001776857164.md", fetched: 2026-11-04 }
  updated: 2026-11-04

