- id: kit.uidesign
  domain: api
  title: UI Design Kit（HDS 组件）
  summary: 官方高级 UI 组件：HdsSideBar / HdsTabs / HdsSnackBar / HdsActionBar 等（6.0 起）。
  since: "API 20"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: "import { HdsTabs } from '@kit.UIDesignKit'（按官方组件页）"
    example: "import { HdsTabs } from '@kit.UIDesignKit';"
    pitfalls: [HDS 组件与自绘组件混排导致风格不一致]
  version_note: "6.0.0(20) 起新增；组件清单以官方为准"
  topics:
    - id: uidesign.intro
      title: UI Design Kit 简介与能力全景
      content: |
        UI Design Kit 是符合 HarmonyOS Design System 的 UI 开发套件，提供三类能力：
        ① 增强型 UI 组件（导航/侧边栏/页签/列表/操作栏等）；② 光影效果（动态模糊、沉浸光感、视效）；
        ③ 多设备适配。它是对 ArkUI 基础能力的封装增强，不是替代品：基础跳转→HdsNavigation、基础切换→HdsTabs、
        普通列表→HdsListItem。详见官方《UI Design Kit 简介》。
      code: |
        // UI Design Kit 能力依赖 @kit.UIDesignKit；
        // 具体组件按官方组件页导入，例如：
        // import { HdsTabs } from '@kit.UIDesignKit';
      source: "https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/ui-design-introduction"
    - id: uidesign.navigation
      title: 组件导航（HdsNavigation / HdsNavDestination）
      content: |
        HdsNavigation 作为路由导航根视图容器，HdsNavDestination 作为子页面根容器。
        相对原生 Navigation 增强：动态模糊标题栏、半模态样式、自定义标题栏区域、文字/图片双类型图标、菜单气泡。
        注意：与原生 Navigation 不能混用于同一路由栈。
      code: |
        // import { HdsNavigation } from '@kit.UIDesignKit';
        // HdsNavigation 作为页面根容器，内部用 NavPathStack 跳转
      source: "https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/ui-design-navigation-dynamic-blur"
    - id: uidesign.sidebar
      title: 侧边栏与侧边栏菜单（HdsSideBar / HdsSideMenu）
      content: |
        HdsSideBar 提供可显隐的侧边栏容器，内容区可自定义，支持悬浮/展开等形态；
        HdsSideMenu 配套一、二级菜单样式，支持新消息红点提醒。平板/PC 分栏常用组合。
      code: |
        // import { HdsSideBar, HdsSideMenu } from '@kit.UIDesignKit';
      source: "https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/ui-design-sidebar-overlay-mode"
    - id: uidesign.tabs
      title: 底部页签（HdsTabs）
      content: |
        HdsTabs 支持视图切换，相对原生 Tabs 增强：分割线动态显隐、页签栏背景模糊、图标出血设计、半屏居中对齐。
        依赖页签栏位于底部（barPosition = BarPosition.End，vertical = false）；跟手滑动需绑定可滚动组件的 Scroller。
      code: |
        // import { HdsTabs } from '@kit.UIDesignKit';
        // Tabs 增强：分割线/模糊/图标出血；barPosition 设为 BarPosition.End
      source: "https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/ui-design-hds-tabs-split-line"
    - id: uidesign.snackbar
      title: 即时操作（HdsSnackBar）
      content: |
        非模态通知组件，用于轻量化反馈：支持图文展示 + 快速操作按钮，可做驻留通知。
        适合「操作成功可撤销」「后台任务进度」这类不打断流程的提示；不要拿它替代 Dialog。
      code: |
        // import { HdsSnackBar } from '@kit.UIDesignKit';
      source: "https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/ui-design-snackbar-resident-notification"
    - id: uidesign.actionbar
      title: 核心操作栏（HdsActionBar）
      content: |
        组合多个按钮的操作栏，主按钮支持展开/收起联动动效。适合编辑类页面底部操作区，
        主次操作要有明确层级；图标与文字按钮混用时保持 40vp 以上热区。
      code: |
        // import { HdsActionBar } from '@kit.UIDesignKit';
      source: "https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/ui-design-actionbar-main-buttons"
    - id: uidesign.list
      title: 列表（HdsListItem）
      content: |
        HdsListItem 封装高端卡片样式，内置横滑删除动效，适配多设备系统风格。
        与 List + ListItem 的关系：结构仍是 List 容器，HdsListItem 负责卡片外观与滑动交互。
      code: |
        // import { HdsListItem } from '@kit.UIDesignKit';
        // 列表容器仍用 List，子项使用 HdsListItem
      source: "https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/ui-design-set-hds-slide-horizon-listitem"
    - id: uidesign.multiwindow
      title: 应用内多窗（MultiWindowEntryInAPP）
      content: |
        单应用多窗口入口：支持自定义图标、背板颜色与大小，实现应用内多窗并行。
        适合平板/PC 的分屏与并行任务；手机端需按窗口能力判断是否可用。
      code: |
        // import { MultiWindowEntryInAPP } from '@kit.UIDesignKit';
      source: "https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/ui-design-multiwindowentryinapp"
    - id: uidesign.icon
      title: 图标处理（分层 / 单层）
      content: |
        官方提供两类图标处理：分层图标（推荐）与单层图标。分层图标把前景/背景拆分，
        可做视差、光效与主题换色，视觉更接近系统；单层图标兼容简单场景与存量资源。
        接入系统风格时优先分层，并保证深浅色下都检查一遍。
      code: ""
      source: ""
    - id: uidesign.visual
      title: 视效、沉浸光感与自定义 Symbol
      content: |
        视觉增强包括：动态模糊、渐变光感、沉浸光感、应用加载自定义 Symbol 等。
        使用原则：光影服务于信息层级（标题栏/浮层/操作区），不要全屏叠加模糊；
        Symbol 需提供变体与动效时优先系统 Symbol，再考虑自定义。
      code: ""
      source: ""
    - id: uidesign.faq
      title: 常见问题与术语
      content: |
        常见问题：① 与 ArkUI 原生组件混用导致风格不一致——同一页面统一组件体系；
        ② 版本门槛——6.0.0(20) 起提供，低版本需降级方案；③ 迁移成本——HDS 组件属性与原生不完全一致，
        升级前先按官方组件页核对 API。术语：HDS（HarmonyOS Design System）、分层图标、出血设计、半模态。
      code: ""
      source: ""
  sources:
    - { title: UI Design Kit 简介, url: "https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/ui-design-introduction", fetched: 2026-11-05 }
  updated: 2026-11-05

