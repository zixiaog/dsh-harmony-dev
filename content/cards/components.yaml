  updated: 2026-11-04

- id: comp.refresh
  domain: component
  title: Refresh 下拉刷新
  summary: 列表/页面下拉刷新容器，需处理刷新态、失败重试与加载文案。
  designClass: container
  codeClass: container
  applies_to: [phone, tablet, 2in1]
  since: "API 8"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  props:
    - { name: refreshing, type: boolean, default: false, desc: 是否正在刷新 }
    - { name: pullToRefresh, type: boolean, default: true, desc: 是否支持下拉 }
  events:
    - { name: onRefreshing, params: "() => void", desc: 触发刷新 }
  sections:
    usage: 列表页标配；刷新失败要给错误提示与重试入口。
    example: "Refresh({ refreshing: this.refreshing })\n  .onRefreshing(() => { this.load() })\n  .pullToRefresh(true)"
    pitfalls: [刷新后不重置 refreshing 导致卡住, 失败无提示]
    a11y: [刷新状态需可读]
    adapt: [宽屏下可改按钮刷新]
    perf: [刷新时避免全量重建列表]
  tokens: [color.font_secondary, motion.duration.simple]
  version_note: "since 待 apidiff 校准"
  sources:
    - { title: 列表（设计规范）, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/list-0000001929853910.md", fetched: 2026-11-04 }
  updated: 2026-11-04
