  updated: 2026-11-04

- id: comp.grid
  domain: component
  title: Grid 网格
  summary: 二维网格布局，配合栅格列数与断点做多端适配。
  designClass: container
  codeClass: layout
  applies_to: [phone, tablet, 2in1]
  since: "API 7"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  props:
    - { name: columnsTemplate, type: string, default: '1fr', desc: 列模板，如 '1fr 1fr' }
    - { name: rowsGap, type: number, default: 0, desc: 行间距，取 spacing token }
    - { name: columnsGap, type: number, default: 0, desc: 列间距，取 spacing token }
  events:
    - { name: onScrollIndex, params: "(first, last) => void", desc: 滚动位置 }
  sections:
    usage: 宫格用 Grid；列表用 List；瀑布流用 WaterFlow。列数随断点变化。
    example: "Grid() {\n  ForEach(this.items, (item) => GridItem() { ... })\n}\n.columnsTemplate(this.cols >= 12 ? '1fr 1fr 1fr 1fr' : '1fr 1fr')"
    pitfalls: [固定 columnsTemplate 不随断点变, 间距写死 13]
    a11y: [网格项需可读标签]
    adapt: [按 4/8/12 列调整列数]
    perf: [大数据用 LazyForEach]
  topics:
    - id: grid.basic
      title: 使用网格（基础）
      content: |
        Grid 用 columnsTemplate/rowsTemplate 定义轨道，GridItem 占格；只给 columnsTemplate 时行数随内容增长。
        间距用 columnsGap/rowsGap 取 token，不要逐项写 margin。
      code: |
        Grid() {
          ForEach(this.items, (item: Item) => {
            GridItem() { Card({ item }) }
          }, (item: Item) => item.id)
        }
        .columnsTemplate('1fr 1fr 1fr')
        .columnsGap(Space.elements.gapNormal)
        .rowsGap(Space.elements.gapNormal)
      source: "https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/arkts-layout-development-create-grid"
    - id: grid.span
      title: 跨行跨列
      content: |
        GridItem 支持 columnStart/columnEnd/rowStart/rowEnd 指定占位区间；超过列数的区间会被裁剪。
        整块卡片推荐用 columnStart(0).columnEnd(列数-1) 占满一行，而不是嵌一层 Row。
      code: |
        GridItem() { Banner() }
          .columnStart(0)
          .columnEnd(2)
      source: "https://developer.huawei.com/consumer/cn/doc/harmonyos-references/ts-container-griditem"
    - id: grid.lazy
      title: 懒加载与滚动监听
      content: |
        网格同样用 LazyForEach + IDataSource 懒加载；滚动位置用 onScrollIndex 获取首尾索引，
        scrollToIndex 需要 Scroller。列数变化时重建模板，避免 GridItem 尺寸缓存错位。
      code: |
        Grid({ scroller: this.scroller }) {
          LazyForEach(this.source, (item: Item) => {
            GridItem() { Card({ item }) }
          }, (item: Item) => item.id)
        }
        .columnsTemplate(this.cols >= 12 ? '1fr 1fr 1fr 1fr' : '1fr 1fr')
        .onScrollIndex((first: number, last: number) => { this.last = last })
      source: "https://developer.huawei.com/consumer/cn/doc/harmonyos-references/ts-container-grid"
  tokens: [layout.breakpoints, space.elements.gapNormal]
  version_note: ""
  sources:
    - { title: 布局基础（栅格）, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/design-layout-basics-0000001795579413.md", fetched: 2026-11-04 }
  updated: 2026-11-04

- id: comp.scroll
  domain: component
  title: Scroll 滚动
  summary: 单屏内容滚动容器，不适合大列表（用 List/LazyForEach）。
  designClass: container
  codeClass: layout
  applies_to: [phone, tablet, 2in1]
  since: "API 7"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  props:
    - { name: scrollBar, type: BarState, default: BarState.Auto, desc: 滚动条状态 }
    - { name: scrollable, type: ScrollDirection, default: ScrollDirection.Vertical, desc: 滚动方向 }
  events:
    - { name: onScroll, params: "(xOffset, yOffset) => void", desc: 滚动回调 }
  sections:
    usage: 内容量小、结构固定用 Scroll；长列表用 List。
    example: "Scroll() {\n  Column({ space: 8 }) { ... }\n}\n.scrollBar(BarState.Auto)"
    pitfalls: [长列表套 Scroll 导致全量渲染, 嵌套滚动手势冲突]
    a11y: [滚动区域需可聚焦]
    adapt: [宽屏内容限宽 2220vp]
    perf: [避免 Scroll 内再嵌 List]
  tokens: [layout.maxContentWidthVp, space.elements.gapNormal]
  version_note: ""
  sources:
    - { title: 布局基础, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/design-layout-basics-0000001795579413.md", fetched: 2026-11-04 }
  updated: 2026-11-04

- id: comp.divider
  domain: component
  title: Divider 分割线
  summary: 视觉分隔，颜色取 comp_divider，间距按层级取 token。
  designClass: display
  codeClass: basic
  applies_to: [phone, tablet, 2in1]
  since: "API 7"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  props:
    - { name: strokeWidth, type: number, default: 1, desc: 线宽 }
    - { name: color, type: ResourceColor, default: null, desc: 颜色取 comp_divider }
    - { name: vertical, type: boolean, default: false, desc: 是否竖线 }
  events: []
  sections:
    usage: 列表内分割线用 List 的 divider 属性统一设置，不逐个插 Divider。
    example: "List().divider({ strokeWidth: 1, color: $r('app.color.comp_divider') })"
    pitfalls: [分割线用纯黑, 每个列表项手插 Divider]
    a11y: []
    adapt: [宽屏下可省略分割线改用间距分组]
    perf: [避免在长列表中大量创建节点]
