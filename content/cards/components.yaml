- id: comp.text
  domain: component
  title: Text 文本
  summary: 展示文本的基础组件，字号/字重/颜色必须取 token。
  designClass: display
  codeClass: basic
  applies_to: [phone, tablet, 2in1, watch]
  since: "API 7"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  props:
    - { name: fontSize, type: number, default: 16, desc: 字号，取 font token（fp） }
    - { name: fontWeight, type: FontWeight, default: FontWeight.Normal, desc: 与层级匹配 }
    - { name: maxLines, type: number, default: null, desc: 最大行数，配合 textOverflow }
  events:
    - { name: onClick, params: "(event: ClickEvent) => void", desc: 点击回调 }
  sections:
    usage: 文本层级按 Display/Title/Subtitle/Body/Caption 取，不自定义字号。
    example: "Text('页面标题')\n  .fontSize(30)                 // Title_L（按设备取 token）\n  .fontWeight(FontWeight.Bold)\n  .fontColor($r('app.color.font_primary'))"
    pitfalls: [fontSize(17) 非阶梯值, 用纯黑当文本色]
    a11y: [纯文本不需要 accessibilityText，但图片化文字需要]
    adapt: [长文本在窄屏设置 maxLines + ellipsis]
    perf: [避免在 build 中拼接大段字符串]
  tokens: [font.Title_L, color.font_primary]
  version_note: ""
  sources:
    - { title: 文本（设计规范）, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/text-0000001956975261.md", fetched: 2026-11-04 }
  updated: 2026-11-04

- id: comp.image
  domain: component
  title: Image 图片
  summary: 展示图片，需设置 objectFit、占位与加载失败兜底。
  designClass: display
  codeClass: media
  applies_to: [phone, tablet, 2in1, watch]
  since: "API 7"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  props:
    - { name: objectFit, type: ImageFit, default: ImageFit.Cover, desc: 图片填充方式 }
    - { name: syncLoad, type: boolean, default: false, desc: 是否同步加载小图 }
    - { name: alt, type: ResourceStr, default: null, desc: 占位图 }
  events:
    - { name: onComplete, params: "(event) => void", desc: 加载完成回调 }
  sections:
    usage: 图片圆角取 8vp；列表内图片统一 objectFit，避免拉伸。
    example: "Image($r('app.media.cover'))\n  .objectFit(ImageFit.Cover)\n  .borderRadius(8)\n  .alt($r('app.media.placeholder'))"
    pitfalls: [不设 objectFit 导致变形, 大图同步加载卡顿]
    a11y: [信息型图片需要 accessibilityText]
    adapt: [宽屏下限制最大宽度，避免无限拉伸]
    perf: [长列表图片用懒加载 + 占位]
  tokens: [radius.image, color.background_secondary]
  version_note: ""
  sources:
    - { title: 图片（设计规范）, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/image-0000001956975273.md", fetched: 2026-11-04 }
  updated: 2026-11-04

- id: comp.textinput
  domain: component
  title: TextInput 文本框
  summary: 单行文本输入，需处理焦点、键盘避让、错误态与无障碍。
  designClass: input
  codeClass: text-input
  applies_to: [phone, tablet, 2in1]
  since: "API 7"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  props:
    - { name: placeholder, type: ResourceStr, default: null, desc: 占位提示 }
    - { name: maxLength, type: number, default: null, desc: 最大长度 }
    - { name: type, type: InputType, default: InputType.Normal, desc: 输入类型（密码/邮箱/数字） }
  events:
    - { name: onChange, params: "(value: string) => void", desc: 输入变化 }
    - { name: onSubmit, params: "(enterKey: EnterKeyType) => void", desc: 提交 }
  sections:
    usage: 输入框高度 40vp、圆角取按钮档位 20vp；错误态用 alert 色描边。
    example: "TextInput({ placeholder: '请输入手机号' })\n  .type(InputType.PhoneNumber)\n  .height(40)\n  .borderRadius(20)"
    pitfalls: [不设 maxLength, 键盘弹出遮挡输入框]
    a11y: [必须有可读的 placeholder 或 accessibilityText]
    adapt: [PC 上支持 Enter 提交，需绑定快捷键语义]
    perf: [onChange 内避免同步网络请求]
  tokens: [radius.button, color.font_secondary, color.alert]
  version_note: ""
  sources:
    - { title: 文本框（设计规范）, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/textinput-0000001957012557.md", fetched: 2026-11-04 }
  updated: 2026-11-04

- id: comp.tabs
  domain: component
  title: Tabs 页签
  summary: 同层内容切换，页签数量与层级需按信息架构控制。
  designClass: navigation
  codeClass: navigation
  applies_to: [phone, tablet, 2in1]
  since: "API 7"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  props:
    - { name: barPosition, type: BarPosition, default: BarPosition.Start, desc: 页签位置 }
    - { name: index, type: number, default: 0, desc: 当前页签 }
    - { name: barMode, type: BarMode, default: BarMode.Fixed, desc: 页签是否均分 }
  events:
    - { name: onChange, params: "(index: number) => void", desc: 页签切换 }
  sections:
    usage: 顶部页签用 Tabs，底部导航用 Tabs + barPosition End；超过 5 个考虑子页签或分类页。
    example: "Tabs({ barPosition: BarPosition.End }) {\n  TabContent() { ... }.tabBar('首页')\n  TabContent() { ... }.tabBar('我的')\n}"
    pitfalls: [页签过多导致文字截断, 页签与内容不同步]
    a11y: [页签文字需可读，图标页签补 accessibilityText]
    adapt: [宽屏下页签可改为左侧导航]
    perf: [TabContent 懒加载，避免一次构建全部页]
  tokens: [color.brand, color.font_secondary, motion.duration.simple]
  version_note: ""
  sources:
    - { title: 底部页签（设计规范）, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/bottomtab-0000001956787789.md", fetched: 2026-11-04 }
  updated: 2026-11-04

- id: comp.navigation
  domain: component
  title: Navigation 导航
  summary: 推荐的路由与页面容器，替代 router，支持 NavPathStack 与分栏。
  designClass: navigation
  codeClass: navigation
  applies_to: [phone, tablet, 2in1]
  since: "API 8"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  props:
    - { name: navDestination, type: "(name: string, param: unknown) => void", default: null, desc: 目标页构建器 }
    - { name: mode, type: NavigationMode, default: NavigationMode.Auto, desc: 单栏/分栏自动切换 }
  events:
    - { name: onNavBarStateChange, params: "(isVisible: boolean) => void", desc: 导航栏显隐 }
  sections:
    usage: 一多页面的标准骨架；分栏阈值 vp≥600；用 NavPathStack 管理栈。
    example: "Navigation(this.pathStack) {\n  // 首页内容\n}\n.mode(NavigationMode.Auto)\n.navDestination(this.PageMap)"
