- id: comp.swiper
  domain: component
  title: Swiper 轮播
  summary: 横向翻页容器，需配导航点与自动播放节制。
  designClass: container
  codeClass: container
  applies_to: [phone, tablet, 2in1]
  since: "API 7"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  props:
    - { name: index, type: number, default: 0, desc: 当前页 }
    - { name: autoPlay, type: boolean, default: false, desc: 是否自动播放 }
    - { name: interval, type: number, default: 3000, desc: 自动播放间隔 }
  events:
    - { name: onChange, params: "(index: number) => void", desc: 翻页回调 }
  sections:
    usage: 轮播页数 ≤5；配 Swiper 导航点；自动播放提供暂停能力。
    example: "Swiper({ index: this.page, autoPlay: false }) {\n  Image($r('app.media.b1'))\n  Image($r('app.media.b2'))\n}\n.indicator(true)"
    pitfalls: [自动播放过快, 无导航点不知页数]
    a11y: [轮播内容需可读，自动播放可暂停]
    adapt: [宽屏下限制轮播高度]
    perf: [图片懒加载]
  tokens: [radius.card, motion.duration.standard]
  version_note: ""
  sources:
    - { title: 导航点（设计规范）, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/swiper-0000001956947629.md", fetched: 2026-11-04 }
  updated: 2026-11-04
