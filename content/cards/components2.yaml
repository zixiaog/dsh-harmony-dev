    a11y: [进度需可读播报]
    adapt: [宽屏下线形更合适]
    perf: [高频更新合并到动画帧]
  tokens: [color.brand, color.font_secondary]
  version_note: ""
  sources:
    - { title: 进度条（设计规范）, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/progress-0000001929656644.md", fetched: 2026-11-04 }
  updated: 2026-11-04

- id: comp.rating
  domain: component
  title: Rating 评分条
  summary: 星级评分输入/展示，支持半星与只读模式。
  designClass: selection
  codeClass: basic
  applies_to: [phone, tablet, 2in1]
  since: "API 7"
  baseline: "6.1.1(24)"
  state_mgmt: V2
