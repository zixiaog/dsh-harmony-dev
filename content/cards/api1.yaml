- id: api.net.http.destroy
  domain: api
  title: "@ohos.net.http · HttpRequest.destroy"
  summary: 释放请求对象资源，请求结束后必须调用。
  since: "API 6"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: "destroy(): void —— 在 finally 中调用，避免异常路径漏掉。"
    example: "try {\n  const res = await req.request(url);\n  return res.result;\n} finally {\n  req.destroy();\n}"
    pitfalls: [只在成功分支 destroy]
    a11y: []
    adapt: []
    perf: [结合连接复用策略]
  tokens: []
  version_note: "API 参考页待补"
  sources: []
