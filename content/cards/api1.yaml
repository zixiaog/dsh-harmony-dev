- id: api.net.http.createHttp
  domain: api
  title: "@ohos.net.http · createHttp"
  summary: 创建 HTTP 请求对象，用于发起一次性网络请求。
  since: "API 6"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: "import { http } from '@kit.NetworkKit'（26 期写法）；旧写法 import http from '@ohos.net.http'。签名：createHttp(): HttpRequest"
    example: "const req = http.createHttp();\nconst res = await req.request(url, {\n  method: http.RequestMethod.GET,\n  readTimeout: 10000,\n});\nreq.destroy();"
    pitfalls: [忘记 destroy 导致连接泄漏, 不处理非 2xx 状态码]
    a11y: []
    adapt: []
    perf: [复用请求对象，避免每次新建]
  tokens: []
  version_note: "权限：ohos.permission.INTERNET；API 参考页待补"
  sources: []
  updated: 2026-11-04

