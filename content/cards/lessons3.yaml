# 高阶与实战课程（第 29~46 讲）。与 lessons.yaml 同 schema。
- id: lesson.29
  domain: tutorial
  title: "第 29 讲：Canvas 图形绘制"
  summary: 自绘图表与图形，处理 DPI、刷新与无障碍替代文本。
  level: 进阶
  order: 29
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  sections:
    usage: 目标：画出可用图表。知识点：Canvas 上下文、按 density 缩放、局部重绘、文本用 Text 保证可读。
    example: "Canvas(this.ctx)\n  .onReady(() => {\n    this.ctx.fillStyle = $r('app.color.brand');\n    this.ctx.fillRect(0, 0, 100, 100);\n  })"
    pitfalls: [画布内画文本导致不可读, 每帧全量重绘]
  checkpoints:
    - 能画出柱状图并标注数值
    - 能解释为何文本不该画在 Canvas 里
  exercise: 用 Canvas 画一个 7 日步数柱状图
  tokens: [color.brand]
  version_note: ""
  sources: []
  updated: 2026-11-04

- id: lesson.30
  domain: tutorial
  title: "第 30 讲：音视频深入"
  summary: AVPlayer 状态机、AVRecorder 录制与后台播放。
