    usage: 目标：播放与录制都稳定。知识点：idle→prepared→playing 状态机、错误监听、seek、释放、后台任务声明。
    example: "player.on('stateChange', (s) => { this.state = s; });\nplayer.on('error', (e) => { this.toast(e.message); });"
