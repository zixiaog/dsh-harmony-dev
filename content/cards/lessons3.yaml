- id: lesson.34
  domain: tutorial
  title: "第 34 讲：权限与隐私合规深入"
  summary: 最小权限、运行时申请、权限说明与隐私政策一致性。
  level: 进阶
  order: 34
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: 目标：权限用得少、说得清。知识点：最小权限原则、reason 文案、拒绝兜底、权限与隐私声明逐项对齐。
    example: "const res = await atManager.requestPermissionsFromUser(ctx, ['ohos.permission.CAMERA']);\nif (res.authResults[0] !== 0) this.showCameraGuide();"
    pitfalls: [申请了不用的权限, 拒绝后功能直接崩]
  checkpoints:
    - 能列出一个功能的必要权限
    - 能写出拒绝后的降级方案
  exercise: 为「扫码」功能写权限申请与降级
