# 组件卡批次 4（14 张）：容器 / 布局 / 媒体类。累计 40 张组件卡。
- id: comp.waterflow
  domain: component
  title: WaterFlow 瀑布流
  summary: 不等高卡片的多列流式布局，适合图片流与商品流。
  designClass: container
  codeClass: layout
  applies_to: [phone, tablet, 2in1]
  since: "API 9"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  props:
    - { name: columnsTemplate, type: string, default: "1fr 1fr", desc: 列数模板 }
    - { name: itemConstraintSize, type: ConstraintSizeOptions, default: null, desc: 卡片尺寸约束 }
  events:
    - { name: onReachEnd, params: "() => void", desc: 到底加载更多 }
  sections:
    usage: 瀑布流列数随断点变化；卡片间距取 12vp。
    example: "WaterFlow() {\n  LazyForEach(this.ds, (item) => FlowItem() { Card(item) })\n}\n.columnsTemplate(this.cols >= 3 ? '1fr 1fr 1fr' : '1fr 1fr')"
    pitfalls: [不等高卡片未设最小高度, 列数固定不随断点]
    a11y: [卡片需可读标题]
    adapt: [按断点 2/3/4 列]
    perf: [必须 LazyForEach]
  topics:
    - id: waterflow.basic
      title: 使用瀑布流（基础）
      content: |
        WaterFlow 子项必须是 FlowItem；按列高自动插入最短列。列数用 columnsTemplate（'1fr 1fr'），
        列/行间距用 columnsGap/rowsGap 取 token；卡片高度不一但需要最小高度约束，防止闪跳。
      code: |
        WaterFlow() {
          LazyForEach(this.source, (item: Item) => {
            FlowItem() {
              Column() { Image(item.cover).aspectRatio(4 / 3); Text(item.title) }
                .borderRadius(Radius.card)
            }
          }, (item: Item) => item.id)
        }
        .columnsTemplate(this.cols >= 12 ? '1fr 1fr 1fr 1fr' : '1fr 1fr')
        .columnsGap(Space.elements.cardGap)
        .rowsGap(Space.elements.cardGap)
      source: "https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/arkts-layout-development-create-waterflow"
    - id: waterflow.loadmore
      title: 触底加载与性能
      content: |
        触底加载用 onReachEnd（或 onScrollIndex 判尾)，加载中要防重复触发；图片必须设置 objectFit 与缓存。
        FlowItem 数量大时只创建可见项，LazyForEach 的 key 必须稳定，否则 insertion 会整列重排。
      code: |
        WaterFlow() { /* LazyForEach */ }
          .onReachEnd(() => {
            if (!this.loading) this.loadMore()
          })
      source: "https://developer.huawei.com/consumer/cn/doc/harmonyos-references/ts-container-waterflow"
    - id: waterflow.vs-list
      title: 与 List / Grid 的选型
      content: |
        信息流高度差大 → WaterFlow；等高卡片宫格 → Grid；单列线性 → List。
        三者都可以 LazyForEach；不要用 List 里塞多列手动模拟瀑布流，会出现测量与复用问题。
      content_note: ""
      source: "https://developer.huawei.com/consumer/cn/doc/harmonyos-guides/arkts-layout-development-create-waterflow"
  tokens: [space.elements.cardGap, radius.card]
  version_note: "since 待 apidiff 校准"
  sources:
    - { title: 布局基础, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/design-layout-basics-0000001795579413.md", fetched: 2026-11-04 }
  updated: 2026-11-04

- id: comp.sidebarcontainer
  domain: component
  title: SideBarContainer 侧边栏容器
  summary: 可折叠侧栏 + 内容区，适合平板/PC 的一多布局。
  designClass: container
  codeClass: layout
  applies_to: [tablet, 2in1]
  since: "API 8"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  props:
    - { name: sideBarWidth, type: number, default: 240, desc: 侧栏宽度 }
    - { name: showSideBar, type: boolean, default: true, desc: 是否显示侧栏 }
    - { name: minContentWidth, type: number, default: 360, desc: 内容区最小宽度 }
  events:
    - { name: onChange, params: "(value: boolean) => void", desc: 侧栏显隐变化 }
  sections:
    usage: 宽屏（vp≥840）常驻侧栏，窄屏折叠为抽屉；宽度用栅格列宽。
    example: "SideBarContainer(SideBarContainerType.Embed) {\n  Column() { /* 侧栏 */ }\n  Column() { /* 内容 */ }\n}\n.sideBarWidth(240)"
    pitfalls: [手机也用常驻侧栏, 侧栏宽度非栅格值]
    a11y: [折叠按钮需可读]
    adapt: [按断点切换 Embed/Overlay/Auto]
    perf: [侧栏内容按需构建]
  tokens: [layout.breakpoints, space.screenMargin]
  version_note: "since 待 apidiff 校准"
