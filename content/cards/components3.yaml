  summary: 一维弹性布局，可按比例分配空间与换行。
  designClass: layout
  codeClass: layout
  applies_to: [phone, tablet, 2in1]
  since: "API 7"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  props:
