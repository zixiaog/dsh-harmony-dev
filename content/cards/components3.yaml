    - { name: alignItems, type: HorizontalAlign, default: HorizontalAlign.Center, desc: 横向对齐 }
  events: []
  sections:
    usage: 纵向堆叠用 Column；子元素多且需滚动时外层用 Scroll/List。
    example: "Column({ space: 8 }) {\n  Text('标题')\n  Text('正文')\n}"
