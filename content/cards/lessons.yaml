    example: "const store = await preferences.getPreferences(this.context, 'settings');\nawait store.put('darkMode', true);\nawait store.flush();\n\nconst rdb = await relationalStore.getRdbStore(this.context, { name: 'app.db', securityLevel: relationalStore.SecurityLevel.S1 });"
    pitfalls: [小配置用数据库, 写后不 flush, ResultSet 不 close]
