- id: lesson.05
  domain: tutorial
  title: "第 5 讲：状态管理 V2"
  summary: "@ComponentV2 + @Local/@Param/@Event/@Provider 的父子与跨层通信。"
  level: 入门
  order: 5
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  sections:
    usage: "目标：用 V2 管理状态。知识点：@Local 内部状态、@Param 父传子、@Event 子调父、@Provider/@Consumer 跨层、@Monitor/@Computed 派生与监听。"
    example: "@ComponentV2\nstruct Child {\n  @Param count: number = 0;\n  @Event onAdd: () => void = () => {};\n  build() { Button(`+1（${this.count}）`).onClick(() => this.onAdd()) }\n}"
    pitfalls: [V1/V2 装饰器混写导致不刷新, 在 @Param 上直接赋值]
    a11y: []
    adapt: []
    perf: [大对象拆细粒度状态，减少无效重绘]
  checkpoints:
    - 能写出父子双向通信
    - 能解释 @Computed 与方法的区别
  exercise: 用 V2 实现「待办列表 + 完成计数」
  tokens: []
  version_note: "V1→V2 迁移见官方迁移指南"
  sources:
    - { title: 状态管理 V1→V2 迁移, url: "https://developer.huawei.com/consumer/cn/doc/harmonyOS-guides/arkts-v1-v2-migration", fetched: 2026-11-04 }
  updated: 2026-11-04

- id: lesson.06
  domain: tutorial
  title: "第 6 讲：列表与懒加载"
  summary: List + LazyForEach + keyGenerator，长列表性能要点。
  level: 入门
  order: 6
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  sections:
    usage: "目标：写出不卡的列表。知识点：List/ListItem、LazyForEach + IDataSource、稳定 key、下拉刷新与到底加载。"
    example: "List({ space: 8 }) {\n  LazyForEach(this.ds, (item: Item) => {\n    ListItem() { Row() { Text(item.title) } }\n  }, (item: Item) => item.id)\n}\n.onReachEnd(() => this.loadMore())"
    pitfalls: [大列表用 ForEach 全量渲染, 列表项内做重计算]
    a11y: [列表项提供可读文本]
    adapt: [平板双列]
    perf: [必须 LazyForEach + keyGenerator]
  checkpoints:
    - 能实现 IDataSource 的 4 个方法
    - 能说明 keyGenerator 的作用
  exercise: 实现 1000 条数据的列表并滚动到 60fps
  tokens: [space.elements.gapNormal]
  version_note: ""
  sources:
    - { title: 列表（设计规范）, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/list-0000001929853910.md", fetched: 2026-11-04 }
  updated: 2026-11-04

- id: lesson.07
  domain: tutorial
  title: "第 7 讲：路由与页面跳转"
  summary: Navigation + NavPathStack 的页面栈与参数传递。
  level: 入门
  order: 7
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  sections:
    usage: "目标：用 Navigation 管理页面栈。知识点：Navigation/NavDestination、pathStack.pushPath、参数传递、返回处理、分栏模式。"
    example: "Navigation(this.pathStack) {\n  // 首页\n}\n.navDestination(this.PageMap)\n\n// 跳转\nthis.pathStack.pushPath({ name: 'detail', param: { id } });"
    pitfalls: [router 与 Navigation 混用, 返回键未处理]
