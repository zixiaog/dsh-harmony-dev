- id: lesson.08
  domain: tutorial
  title: "第 8 讲：网络请求与数据解析"
  summary: http 请求、超时、错误分支与 JSON 解析。
  level: 入门
  order: 8
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: V2
  deprecated: false
  sections:
    usage: "目标：安全可靠地取数据。知识点：createHttp/request/destroy、超时、状态码判断、try/catch、loading/error 态。"
    example: "const req = http.createHttp();\ntry {\n  const res = await req.request(url, { method: http.RequestMethod.GET, readTimeout: 10000 });\n  if (res.responseCode !== 200) throw new Error(`HTTP ${res.responseCode}`);\n  this.list = JSON.parse(res.result as string);\n} catch (e) {\n  this.error = '加载失败，点击重试';\n} finally {\n  req.destroy();\n}"
    pitfalls: [不处理非 2xx, 不设超时, 忘记 destroy]
    a11y: [错误提示可读]
    adapt: []
    perf: [请求合并与缓存]
  checkpoints:
    - 能写出带错误分支的请求
    - 能说明 destroy 的必要性
  exercise: 请求一个 JSON 列表并渲染，失败可重试
  tokens: []
  version_note: "权限：ohos.permission.INTERNET"
  sources: []
  updated: 2026-11-04

