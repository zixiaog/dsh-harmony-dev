# 入门课程（10 讲）。domain: tutorial；每讲含学习目标、知识点、关键代码、练习、自检点、常见错误。
- id: lesson.01
  domain: tutorial
  title: "第 1 讲：环境与工程结构"
  summary: DevEco Studio 工程结构、Stage 模型目录与首个页面。
  level: 入门
  order: 1
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: "目标：跑通 DevEco 工程并理解 entry/src/main/ets 的目录职责。知识点：AppScope、entry 模块、module.json5、pages 目录、UIAbility 入口。"
    example: "entry/src/main/ets/\n├─ entryability/EntryAbility.ets   // 生命周期，loadContent('pages/Index')\n├─ pages/Index.ets                 // 首页\n├─ entrybackupability/\n└─ workers/"
    pitfalls: [改了页面路径但没改 loadContent, 在 entryability 里写业务 UI]
    a11y: []
    adapt: []
    perf: [首屏只加载必要资源]
  checkpoints:
    - 能说出 UIAbility 三个关键生命周期回调
    - 知道 pages 下新增页面要注册路由
  exercise: 新建 About 页面并从首页跳转过去
  tokens: []
  version_note: "以 DevEco Studio 当前版本为准"
  sources: []
  updated: 2026-11-04

- id: lesson.02
  domain: tutorial
  title: "第 2 讲：ArkTS 语法速通"
  summary: 类型、接口、泛型、空安全与 ArkTS 限制。
  level: 入门
  order: 2
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: "目标：写出类型安全的 ArkTS。知识点：interface/type、可选链、非空断言、泛型、禁止 any/eval、对象字面量与结构化类型。"
    example: "interface Item { id: string; title: string; done?: boolean }\nconst list: Item[] = [{ id: '1', title: '买牛奶' }];\nconst first = list[0]?.title ?? '空';"
    pitfalls: [用 any 绕过类型检查, 依赖 TS 的动态特性]
    a11y: []
    adapt: []
    perf: [集合遍历用 for-of，避免频繁闭包]
  checkpoints:
    - 能解释 `?.` 与 `??` 的区别
    - 能定义并约束一个泛型函数
  exercise: 给 Todo 定义类型并用 Map 去重
  tokens: []
  version_note: ""
  sources: []
  updated: 2026-11-04

- id: lesson.03
  domain: tutorial
  title: "第 3 讲：声明式 UI 与第一个组件"
  summary: "@Component、build()、组件参数与事件。"
  level: 入门
  order: 3
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: "目标：理解「状态驱动 UI」。知识点：@Component 结构、build() 只能声明 UI、@Builder 复用、onClick 事件。"
    example: "@Component\nstruct Counter {\n  @Local count: number = 0;\n  build() {\n    Row({ space: 12 }) {\n      Button('-').onClick(() => this.count--)\n      Text(`${this.count}`)\n      Button('+').onClick(() => this.count++)\n    }\n  }\n}"
    pitfalls: [在 build 里做副作用/网络请求, 用命令式方式改 UI]
    a11y: []
    adapt: []
    perf: [避免在 build 中拼接大字符串]
  checkpoints:
    - 能说出 build() 中禁止做的事
    - 能解释一次状态变化为何会触发重绘
  exercise: 把计数器拆成两个组件并通过参数通信
  tokens: []
  version_note: ""
  sources: []
  updated: 2026-11-04

- id: lesson.04
  domain: tutorial
  title: "第 4 讲：布局容器与 8vp 网格"
  summary: Column/Row/Stack/Flex/Grid 的选择与间距规范。
  level: 入门
  order: 4
  since: "—"
  baseline: "6.1.1(24)"
  state_mgmt: "—"
  deprecated: false
  sections:
    usage: "目标：用容器组合出规范布局。知识点：Column/Row/Stack/Grid/RelativeContainer 的适用场景；间距取 8 的倍数；屏幕 margin 手机 16vp。"
    example: "Column({ space: 8 }) {\n  Row() { Text('标题'); Blank(); Text('更多').fontColor($r('app.color.font_secondary')) }\n  Grid() { /* ... */ }.columnsTemplate('1fr 1fr')\n}.padding({ left: 16, right: 16 })"
    pitfalls: [用固定像素写布局, 逐个元素加 margin 代替 space]
    a11y: []
    adapt: [按 600/840vp 断点换列数]
    perf: [避免三层以上无意义嵌套]
  checkpoints:
    - 能说出 Grid 与 WaterFlow 的区别
    - 能按断点把 1 列改成 2 列
  exercise: 做一个「2 行 2 列」的宫格首页
  tokens: [space.elements.gapNormal, space.screenMargin]
  version_note: ""
  sources:
    - { title: 间隔参数, url: "https://developer.huawei.com/consumer/cn/doc/doccenter-ux-design/interval-parameter-0000002562577161.md", fetched: 2026-11-04 }
