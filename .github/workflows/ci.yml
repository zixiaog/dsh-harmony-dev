name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python -m pip install --upgrade pyyaml

      - name: Host self-test (5 tools)
        run: node scripts/test_m0.mjs

      - name: Rules regression
        run: python scripts/check_rules.py

      - name: Golden set (52 cases)
        run: node scripts/run_golden.mjs

      - name: End-to-end (7 steps)
        run: node scripts/e2e.mjs

      - name: Package check
        run: node scripts/check_package.mjs
